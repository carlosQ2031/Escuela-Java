spring.application.name=producto-ms

server.port=8081

# Datasource - Postgres productos
spring.datasource.url=jdbc:postgresql://localhost:5434/productosdb
spring.datasource.username=productos_user
spring.datasource.password=productos_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
