spring.application.name=pedidos-ms

server.port=8080

# Datasource - Postgres pedidos
spring.datasource.url=jdbc:postgresql://localhost:5433/pedidosdb
spring.datasource.username=pedidos_user
spring.datasource.password=pedidos_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
